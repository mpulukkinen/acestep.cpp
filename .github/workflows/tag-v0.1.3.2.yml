name: Tag v0.1.3.2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v0.1.3.2 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.3.2 >/dev/null 2>&1; then
            echo "v0.1.3.2 already exists"
            exit 0
          fi
          git tag v0.1.3.2 "$GITHUB_SHA"
          git push origin refs/tags/v0.1.3.2
