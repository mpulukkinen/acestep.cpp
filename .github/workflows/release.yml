name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

jobs:
  linux:
    name: Linux x64 (CPU + CUDA + Vulkan)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libvulkan-dev glslc

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: 12.8.1
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
          log-file-suffix: ubuntu-22.04.txt

      - name: Build every Linux backend
        run: ./buildall.sh

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/acestep-linux-x64
          cp build/ace-lm build/ace-synth build/ace-server build/ace-understand \
             build/quantize build/neural-codec build/mp3-codec \
             dist/acestep-linux-x64/
          find build -maxdepth 1 \( -type f -o -type l \) -name '*.so*' \
            -exec cp -L '{}' dist/acestep-linux-x64/ \;
          tar -C dist -czf acestep-linux-x64.tar.gz acestep-linux-x64

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: acestep-linux-x64
          path: acestep-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64 (CPU + CUDA + Vulkan)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: 12.8.1
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          log-file-suffix: windows-2022.txt

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Build every Windows backend
        shell: cmd
        run: buildall.cmd

      - name: Package
        shell: pwsh
        run: |
          $package = "dist/acestep-windows-x64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/Release/*.exe" $package
          Copy-Item "build/Release/*.dll" $package
          Compress-Archive -Path $package -DestinationPath "acestep-windows-x64.zip"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: acestep-windows-x64
          path: acestep-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --clobber
