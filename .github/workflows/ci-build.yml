name: Build

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-all:
    name: Linux x64 (CPU + CUDA + Vulkan)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: 12.8.1
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
          log-file-suffix: ubuntu-22.04.txt

      - name: Build every Linux backend
        run: ./buildall.sh

      - name: Check expected binaries
        run: |
          test -x build/ace-lm
          test -x build/ace-synth
          test -x build/ace-server
          test -x build/ace-understand
          test -x build/quantize
          test -x build/neural-codec
          test -x build/mp3-codec

  windows-all:
    name: Windows x64 (CPU + CUDA + Vulkan)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: 12.8.1
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          log-file-suffix: windows-2022.txt

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Build every Windows backend
        shell: cmd
        run: buildall.cmd

      - name: Check expected binaries
        shell: pwsh
        run: |
          $expected = @(
            "ace-lm", "ace-synth", "ace-server", "ace-understand",
            "quantize", "neural-codec", "mp3-codec"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path "build/$name.exe")) {
              throw "Missing build/$name.exe"
            }
          }
