name: Build

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-all:
    name: Linux x64 (CPU + CUDA + Vulkan)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install SPIR-V headers
        shell: bash
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 \
            https://github.com/KhronosGroup/SPIRV-Headers.git .deps/SPIRV-Headers
          cmake -S .deps/SPIRV-Headers -B .deps/SPIRV-Headers-build \
            -DCMAKE_INSTALL_PREFIX="$PWD/.deps/spirv-headers"
          cmake --install .deps/SPIRV-Headers-build
          echo "CMAKE_PREFIX_PATH=$PWD/.deps/spirv-headers" >> "$GITHUB_ENV"

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: 12.8.1
          method: network
          log-file-suffix: ubuntu-22.04.txt

      - name: Build every Linux backend
        run: ./buildall.sh

      - name: Check expected binaries
        run: |
          test -x build/ace-lm
          test -x build/ace-synth
          test -x build/ace-server
          test -x build/ace-understand
          test -x build/quantize
          test -x build/neural-codec
          test -x build/mp3-codec

  windows-all:
    name: Windows x64 (CPU + CUDA + Vulkan)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: 12.8.1
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          log-file-suffix: windows-2022.txt

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install SPIR-V headers
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE/.deps/SPIRV-Headers"
          $build = "$env:GITHUB_WORKSPACE/.deps/SPIRV-Headers-build"
          $prefix = "$env:GITHUB_WORKSPACE/.deps/spirv-headers"
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 `
            https://github.com/KhronosGroup/SPIRV-Headers.git $source
          cmake -S $source -B $build "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --install $build
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build every Windows backend
        shell: cmd
        run: buildall.cmd

      - name: Check expected binaries
        shell: pwsh
        run: |
          $expected = @(
            "ace-lm", "ace-synth", "ace-server", "ace-understand",
            "quantize", "neural-codec", "mp3-codec"
          )
          foreach ($name in $expected) {
            $binary = Get-ChildItem build -Recurse -File -Filter "$($name).exe" |
              Select-Object -First 1
            if (-not $binary) {
              throw "Missing $($name).exe under build/"
            }
            Write-Host "$($name).exe: $($binary.FullName)"
          }
